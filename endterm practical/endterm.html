<!DOCTYPE html>
<html>
<head>
  <title>Even Odd Checker</title>

  <style>

    body{
      margin:0;
      padding:0;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      background:#f2f2f2;
      font-family:Arial;
    }

    .box{
      background:white;
      padding:30px;
      border-radius:10px;
      box-shadow:0 0 10px gray;
      text-align:center;
      width:300px;
    }

    input{
      width:90%;
      padding:10px;
      margin-top:10px;
    }

    button{
      padding:10px 20px;
      margin-top:15px;
      background:blue;
      color:white;
      border:none;
      cursor:pointer;
    }

    h3{
      margin-top:20px;
      color:green;
    }

  </style>

</head>
<body>

<div class="box">

  <h2>Even / Odd Checker</h2>

  <input type="number" id="num" placeholder="Enter Number">

  <br>

  <button onclick="check()">Check</button>

  <h3 id="result"></h3>

</div>

<script>

function check(){

  let num = document.getElementById("num").value;

  if(num % 2 == 0){
    document.getElementById("result").innerHTML = "Even Number";
  }
  else{
    document.getElementById("result").innerHTML = "Odd Number";
  }

}

</script>

</body>
</html>
